name: Build Android app

# Android 侧没有随仓库提交的构建产物，本地也不一定装了 Android SDK，
# 因此把"单元测试 + 编译 debug APK"放到 CI 上跑。
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "release-assets/**"
      - "release-notes/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "release-assets/**"
      - "release-notes/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest 自带 Android SDK 并已接受许可，不要用
        # android-actions/setup-android：它的 v3 会去安装早已下架的 legacy
        # `tools` 包，直接 "Failed to find package 'tools'" 让 job 失败。
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDKMGR" --list_installed | head -n 40 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aoxiang-assistant-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7
