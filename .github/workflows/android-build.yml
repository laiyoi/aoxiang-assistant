name: Build Android app

# Android 侧没有随仓库提交的构建产物，本地也不一定装了 Android SDK，
# 因此把"单元测试 + 编译 debug APK + 滚动发布 latest"放到 CI 上跑。
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "release-assets/**"
      - "release-notes/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "release-assets/**"
      - "release-notes/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # ubuntu-latest 自带 Android SDK 并已接受许可，不要用
        # android-actions/setup-android：它的 v3 会去安装早已下架的 legacy
        # `tools` 包，直接 "Failed to find package 'tools'" 让 job 失败。
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDKMGR" --list_installed | head -n 40 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aoxiang-assistant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  # 只有 build 成功（即单元测试通过、APK 产出）才会走到这里。
  # pull_request 不发布，避免来自 fork / PR 的构建覆盖 latest。
  publish-latest:
    name: Publish rolling latest release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # 串行化：两个构建同时结束时不至于互相删掉对方刚发布的 release。
    concurrency:
      group: android-latest-release
      cancel-in-progress: false
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: aoxiang-assistant-debug
          path: dist

      - name: Rename APK
        run: |
          set -euo pipefail
          ls -l dist
          mv dist/app-debug.apk dist/aoxiang-assistant-latest.apk
          ls -l dist

      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 先删掉上一次的 latest（含 tag），保证同名 tag 不会因残留而创建失败。
          gh release delete latest --yes --cleanup-tag \
            --repo "$GITHUB_REPOSITORY" || true

          {
            echo "自动构建的 **debug** APK，可直接安装测试，不是正式发布。"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 分支 | \`$GITHUB_REF_NAME\` |"
            echo "| 提交 | \`$GITHUB_SHA\` |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 构建记录 | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "> 每次构建都会覆盖这个 release；正式版本见 \`v*\` 标签下的 release。"
          } > RELEASE_NOTES.md

          gh release create latest dist/aoxiang-assistant-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "最新开发版 (latest)" \
            --prerelease \
            --notes-file RELEASE_NOTES.md

          gh release view latest --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isPrerelease,assets
